# GitGuardian configuration — silence false positives on public-safe keys.
#
# PostHog Project API Keys (phc_) are client-side by design: they can only
# capture new events, never read/query/export data. PostHog docs state:
# "it is totally okay to publicly release the project API key."
# https://posthog.com/docs/data/project-api-key
#
# This key is embedded in src/lib/posthog.ts and ~121 HTML pages (inline
# snippet). Rotating it would break analytics and re-trigger this alert.

version: 2

exit_zero: false
verbose: false
instance: https://dashboard.gitguardian.com
max_commits_for_hook: 50
allow_self_signed: false

secret:
  # Disable the detector repo-wide — survives key rotations.
  ignored_detectors:
    - PostHog Project API Key

  # Backup: ignore the specific current key by literal value.
  ignored_matches:
    - name: "PostHog project API key (client-side, public by design)"
      match: phc_lyZCgvTpicjLzAO3rY2GhxuX5WUc5jQjP8ZVwwJqauX
