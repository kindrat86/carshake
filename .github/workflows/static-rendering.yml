name: Static rendering regression
on: [push, pull_request]
# Fixed test commands only; no event payloads are interpolated into shell code.
permissions:
  contents: read
jobs:
  static-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run guard:static
